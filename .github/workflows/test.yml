name: 单元测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 获取项目
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 运行单元测试
        run: npm test
